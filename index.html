<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <header class="container  py-3 d-flex justify-content-between align-items-center">
        <h1 class="fw-bold">🏋️ Fitness Tracker</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#workoutModal">+ Add Workout</button>
    </header>


    <!--=========================================================Add Workout Modal -->

    <div class="modal fade" id="workoutModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="addWorkoutForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Workout</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="editIndex" />
                        <div class="row">

                            <div class="mb-3 col-6">
                                <label for="personName" class="form-label">Name<span
                                        class="text-danger">*</span></label>
                                <input type="text" id="personName" class="form-control" placeholder="Enter your name" />
                                <div class="errorMessage text-danger"></div>

                            </div>

                            <div class="mb-3 col-6">
                                <label for="workoutDate" class="form-label">Date<span
                                        class="text-danger">*</span></label>
                                <input type="date" id="workoutDate" class="form-control" />
                                <div class="errorMessage text-danger"></div>
                            </div>
                        </div>

                        <h6 class="fw-bold">Workout Entries</h6>
                        <div class="d-flex mt-0 mb-2">
                            <button type="button" id="addWorkoutRowAddModal" class="btn btn-lg btn-primary">
                                +
                            </button>
                        </div>

                        <div id="workoutRowsContainer">
                 

                            <div class="row g-2 mb-3 ">
                                <div class="col-md-4"> <label for="workoutType" class="form-label">Workout Type<span
                                            class="text-danger">*</span></label>
                                    <select class="form-select workout-type" id="workoutType" required>
                                        <option value="">Select Type</option>
                                        <option>Running</option>
                                        <option>Cycling</option>
                                        <option>Yoga</option>
                                        <option>Weightlifting</option>
                                    </select>
                                    <div class="errorMessage text-danger"></div>
                                </div>
                                <div class="col-md-3 ">
                                    <label for="workoutDuration" class="form-label">Duration<span
                                            class="text-danger">*</span></label>
                                    <input type="number" id="workoutDuration" class="form-control duration"
                                        placeholder="Duration (min)" required />
                                    <div class="errorMessage text-danger"></div>
                                </div>
                                <div class="col-md-3 ">
                                    <label for="caloriesBurned" class="form-label">Calories<span
                                            class="text-danger">*</span></label>
                                    <input type="number" id="caloriesBurned" class="form-control calories"
                                        placeholder="Calories Burned" required />
                                    <div class="errorMessage text-danger"></div>
                                </div>
                                <div class="col-md-2 text-end d-flex justify-content-center mt-3 align-items-center">
                                    <button type="button" class="btn bg-primary   "
                                        style="margin-bottom: 0px;">X</button>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" id="addWorkoutBtn" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- <div class="row">
    <div class="col 6">

    </div>
    <div class="col 6">
        
    </div> -->
    <!-- </div> -->


    <!--================================================ Delete Confirmation Modal -->

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Confirm Deletion</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-0 pb-3">
                    <p>Are you sure you want to delete this workout?</p>
                    <div class="text-danger fs-4 mt-0" id="deleteWarning"></div>
                    <div class="text-end mt-2">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button id="confirmDeleteBtn" type="submit" class="btn btn-danger">Okay</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ///////////////////////////////////////////////////////////////////////////////////////////// -->

    <!-- ===============================================main content=============================================== -->
    <main class="bg-body-tertiary mt-0">
        <div class="container">
            <div class="row py-4">
                <div class="d-flex mb-3  justify-content-end">
                    <div class="me-3">
                        <button class="btn btn-outline-primary view-toggle" id="tableViewBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-table" viewBox="0 0 16 16">
                                <path
                                    d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 2h-4v3h4zm0 4h-4v3h4zm0 4h-4v3h3a1 1 0 0 0 1-1zm-5 3v-3H6v3zm-5 0v-3H1v2a1 1 0 0 0 1 1zm-4-4h4V8H1zm0-4h4V4H1zm5-3v3h4V4zm4 4H6v3h4z" />
                            </svg>
                            Table View
                        </button>
                        <button class="btn btn-outline-primary view-toggle" id="cardViewBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-grid-3x3" viewBox="0 0 16 16">
                                <path
                                    d="M0 1.5A1.5 1.5 0 0 1 1.5 0h13A1.5 1.5 0 0 1 16 1.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5zM1.5 1a.5.5 0 0 0-.5.5V5h4V1zM5 6H1v4h4zm1 4h4V6H6zm-1 1H1v3.5a.5.5 0 0 0 .5.5H5zm1 0v4h4v-4zm5 0v4h3.5a.5.5 0 0 0 .5-.5V11zm0-1h4V6h-4zm0-5h4V1.5a.5.5 0 0 0-.5-.5H11zm-1 0V1H6v4z" />
                            </svg>
                            Card View
                        </button>
                    </div>

                </div>
                <!-- ==============================================================search inpput -->
                <div class="d-flex my-3 px-0">
                    <div class="input-group">
                        <span class="input-group-text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                                class="bi bi-search" viewBox="0 0 16 16">
                                <path
                                    d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                            </svg>
                        </span>
                        <input class="form-control" type="search" id="searchInput" style="height: 55px;"
                            placeholder="Search workouts..." aria-label="Search">
                    </div>
                </div>
                <!-- =================================================Edit modal================================================= -->
                <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <form id="editForm">
                                <div class="modal-header">
                                    <h5 class="modal-title">Edit Workout</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>

                                <div class="modal-body">
                                    <input type="hidden" id="editIndex" />
                                    <div class="row">

                                        <div class="mb-3 col-6">
                                            <label for="editPersonName" class="form-label">Name<span
                                                    class="text-danger">*</span></label>
                                            <input type="text" id="editPersonName" class="form-control"
                                                placeholder="Enter your name" />
                                            <div class="errorMessage text-danger"></div>

                                        </div>

                                        <div class="mb-3 col-6">
                                            <label for="editWorkoutDate" class="form-label">Date<span
                                                    class="text-danger">*</span></label>
                                            <input type="date" id="editWorkoutDate" class="form-control" />
                                            <div class="errorMessage text-danger"></div>
                                        </div>
                                    </div>

                                    <h6 class="fw-bold">Workout Entries</h6>
                                    <div class="d-flex mt-0 mb-2">
                                        <button type="button" id="addWorkoutRowEditMOdal"
                                            class="btn btn-lg btn-primary">
                                            +
                                        </button>
                                    </div>

                                    <div id="editWorkoutRowsContainer">
                             


                                        <div class="row g-2 mb-3 workout-row">
                                            <div class="col-md-4"> <label for="editWorkoutType"
                                                    class="form-label">Workout Type<span
                                                        class="text-danger">*</span></label>
                                                <select class="form-select workout-type" id="editWorkoutType" required>
                                                    <option value="">Select Type</option>
                                                    <option>Running</option>
                                                    <option>Cycling</option>
                                                    <option>Yoga</option>
                                                    <option>Weightlifting</option>
                                                </select>
                                                <div class="errorMessage text-danger"></div>
                                            </div>
                                            <div class="col-md-3 ">
                                                <label for="editWorkoutDuration" class="form-label">Duration<span
                                                        class="text-danger">*</span></label>
                                                <input type="number" id="editWorkoutDuration"
                                                    class="form-control duration" placeholder="Duration (min)"
                                                    required />
                                                <div class="errorMessage text-danger"></div>
                                            </div>
                                            <div class="col-md-3 ">
                                                <label for="editCaloriesBurned" class="form-label">Calories<span
                                                        class="text-danger">*</span></label>
                                                <input type="number" id="editCaloriesBurned"
                                                    class="form-control calories" placeholder="Calories Burned"
                                                    required />
                                                <div class="errorMessage text-danger"></div>
                                            </div>
                                            <div
                                                class="col-md-2 text-end d-flex justify-content-center mt-3 align-items-center">
                                                <button type="button" class="btn bg-primary   "
                                                    style="margin-bottom: 0px;">X</button>
                                            </div>
                                        </div>

                                    </div>
                                </div>

                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>
                                    <button type="submit" id="updateWorkout" class="btn btn-primary">Update</button>

                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- =========================================================Table View============================================================= -->
                <div id="tableView">
                    <table class="table table-hover table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th class="text-secondary">Name</th>
                                <th class="text-secondary">Date</th>
                                <th class="text-secondary">Workout Type</th>
                                <th class="text-secondary">Duration (minutes)</th>
                                <th class="text-secondary">Calories Burned</th>
                                <th class="text-secondary">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="workoutList" class="table-group-divider">
                            
                        </tbody>
                    </table>
                </div>

        
                <div id="cardView" class="row g-4" style="display: none;">
         
                </div>
            </div>






            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
